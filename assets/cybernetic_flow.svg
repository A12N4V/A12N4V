<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="260">
  <defs>
    <style>
      @keyframes signalFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 2px rgba(210,153,34,0.3)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(210,153,34,0.7)); }
      }
      @keyframes nodePulse {
        0%, 100% { border-color: #21262d; }
        50% { border-color: #d29922; }
      }
      .bg-panel { fill: #07090e; stroke: #1b2028; stroke-width: 1; rx: 6; }
      .grid-line { stroke: #12161f; stroke-width: 0.75; stroke-dasharray: 4, 8; }
      .base-wire { stroke: #1c222c; stroke-width: 2; fill: none; }
      .active-wire-gold {
        stroke: url(#goldStream);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 12, 28;
        animation: signalFlow 4s linear infinite;
      }
      .active-wire-cyan {
        stroke: url(#cyanStream);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 12, 28;
        animation: signalFlow 4s linear infinite reverse;
      }
      .node-box { fill: #0d1117; stroke: #262c36; stroke-width: 1.2; rx: 4; }
      .node-box-active { fill: #0e131b; stroke: #384252; stroke-width: 1.5; rx: 4; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; font-size: 12px; fill: #f0efea; letter-spacing: 0.08em; }
      .sub-text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #8b949e; letter-spacing: 0.04em; }
      .tag-text { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 9px; fill: #6e7681; letter-spacing: 0.12em; }
      .accent-gold { fill: #d29922; }
      .accent-cyan { fill: #58a6ff; }
      .accent-green { fill: #3fb950; }
    </style>

    <linearGradient id="goldStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f2cc60" stop-opacity="1" />
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cyanStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d29922" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Panel Background -->
  <rect x="1" y="1" width="858" height="258" class="bg-panel" />

  <!-- Subtle Blueprint Grid -->
  <line x1="40" y1="40" x2="820" y2="40" class="grid-line" />
  <line x1="40" y1="130" x2="820" y2="130" class="grid-line" />
  <line x1="40" y1="220" x2="820" y2="220" class="grid-line" />
  <line x1="225" y1="20" x2="225" y2="240" class="grid-line" />
  <line x1="430" y1="20" x2="430" y2="240" class="grid-line" />
  <line x1="635" y1="20" x2="635" y2="240" class="grid-line" />

  <!-- Header Telemetry -->
  <text x="30" y="28" class="tag-text" fill="#8b949e">
    <tspan fill="#d29922">●</tspan> CAUSAL CYBERNETIC MATRIX // CLOSED-LOOP DYNAMICAL TOPOLOGY
  </text>
  <text x="830" y="28" class="tag-text" text-anchor="end" fill="#6e7681">
    CONTINUOUS REAL-TIME ADAPTATION · 20W BIO-EQUIVALENT
  </text>

  <!-- Feedback Loop Paths -->
  <!-- Top Path: Environment -> Sensitization -> Internal Model -->
  <path d="M 130 90 L 130 65 Q 130 55 140 55 L 420 55 Q 430 55 430 65 L 430 90" class="base-wire" />
  <path d="M 130 90 L 130 65 Q 130 55 140 55 L 420 55 Q 430 55 430 65 L 430 90" class="active-wire-gold" />

  <!-- Forward Top Path: Internal Model -> Afferent Analysis -> Efferent Policy -->
  <path d="M 430 90 L 430 65 Q 430 55 440 55 L 720 55 Q 730 55 730 65 L 730 90" class="base-wire" />
  <path d="M 430 90 L 430 65 Q 430 55 440 55 L 720 55 Q 730 55 730 65 L 730 90" class="active-wire-gold" />

  <!-- Bottom Path: Efferent Motor Execution -> Intervention in Environment -->
  <path d="M 730 170 L 730 195 Q 730 205 720 205 L 140 205 Q 130 205 130 195 L 130 170" class="base-wire" />
  <path d="M 730 170 L 730 195 Q 730 205 720 205 L 140 205 Q 130 205 130 195 L 130 170" class="active-wire-cyan" />

  <!-- Central Lateral Feedback (Error Correction) -->
  <path d="M 230 130 L 330 130" class="base-wire" />
  <path d="M 230 130 L 330 130" class="active-wire-gold" />

  <path d="M 530 130 L 630 130" class="base-wire" />
  <path d="M 530 130 L 630 130" class="active-wire-gold" />

  <!-- NODES -->

  <!-- Node 1: Physical Environment -->
  <g transform="translate(30, 90)">
    <rect width="200" height="80" class="node-box" />
    <line x1="0" y1="0" x2="3" y2="0" stroke="#8b949e" stroke-width="3" />
    <circle cx="20" cy="24" r="3.5" fill="#8b949e" />
    <text x="32" y="28" class="title-text">01. PHYSICAL WORLD</text>
    <text x="20" y="48" class="sub-text">Dissipative reality &amp; work</text>
    <text x="20" y="63" class="tag-text">THERMODYNAMIC SUBSTRATE</text>
  </g>

  <!-- Node 2: Generative Model / State Estimator -->
  <g transform="translate(330, 90)">
    <rect width="200" height="80" class="node-box-active" />
    <line x1="0" y1="0" x2="200" y2="0" stroke="#d29922" stroke-width="1.5" />
    <circle cx="20" cy="24" r="3.5" fill="#d29922" />
    <text x="32" y="28" class="title-text">02. INTERNAL MODEL</text>
    <text x="20" y="48" class="sub-text">Attractors &amp; prediction error</text>
    <text x="20" y="63" class="tag-text" fill="#d29922">ACTIVE INFERENCE ENGINE</text>
  </g>

  <!-- Node 3: Efferent Homeostasis / Action -->
  <g transform="translate(630, 90)">
    <rect width="200" height="80" class="node-box" />
    <line x1="197" y1="0" x2="200" y2="0" stroke="#58a6ff" stroke-width="3" />
    <circle cx="20" cy="24" r="3.5" fill="#58a6ff" />
    <text x="32" y="28" class="title-text">03. REGULATION</text>
    <text x="20" y="48" class="sub-text">Homeostatic motor policy</text>
    <text x="20" y="63" class="tag-text" fill="#58a6ff">CLOSED-LOOP ACTUATION</text>
  </g>

  <!-- Flow Direction Arrows & Markers -->
  <!-- Top left flow indicator -->
  <polygon points="285,52 295,55 285,58" fill="#d29922" opacity="0.8" />
  <polygon points="585,52 595,55 585,58" fill="#d29922" opacity="0.8" />
  <!-- Bottom return flow indicator -->
  <polygon points="435,202 425,205 435,208" fill="#58a6ff" opacity="0.8" />

  <!-- Footer Telemetry Labels -->
  <text x="30" y="240" class="tag-text" fill="#6e7681">
    TRANSCRIPTION: SENSORY STREAM → CAUSAL BELIEF → WORK INTERVENTION → STABILIZATION
  </text>
  <text x="830" y="240" class="tag-text" text-anchor="end" fill="#3fb950">
    STATUS // HOMEOSTATIC EQUILIBRIUM ACTIVE
  </text>
</svg>
