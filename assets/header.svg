<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <style>
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes sweepLine {
        0% { transform: translateX(0); }
        100% { transform: translateX(900px); }
      }
      .bg-rect { fill: #07090e; }
      .grid-pattern { fill: none; stroke: #141923; stroke-width: 0.75; stroke-dasharray: 2, 6; }
      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.03em;
        fill: #f0efea;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 0.02em;
      }
      .meta-tag {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #6e7681;
        letter-spacing: 0.08em;
      }
      .badge-bg { fill: #111620; stroke: #212836; stroke-width: 1; rx: 4; }
      .badge-text {
        font-family: 'SF Mono', 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #58a6ff;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .accent-line { stroke: url(#goldGrad); stroke-width: 1.5; }
    </style>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d29922" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glowBackdrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect width="900" height="170" rx="6" class="bg-rect" />
  <rect width="900" height="90" rx="6" fill="url(#glowBackdrop)" />
  <rect x="0.5" y="0.5" width="899" height="169" rx="6" fill="none" stroke="#1f2633" stroke-width="1" />

  <!-- Grid Accents -->
  <line x1="30" y1="40" x2="870" y2="40" class="grid-pattern" />
  <line x1="30" y1="120" x2="870" y2="120" class="grid-pattern" />
  <line x1="300" y1="10" x2="300" y2="160" class="grid-pattern" />
  <line x1="650" y1="10" x2="650" y2="160" class="grid-pattern" />

  <!-- Top Accent Bar -->
  <line x1="30" y1="1" x2="250" y2="1" class="accent-line" />

  <!-- Content -->
  <g transform="translate(40, 30)">
    <!-- Location / University Badge -->
    <g transform="translate(0, 5)">
      <rect width="210" height="22" class="badge-bg" />
      <circle cx="12" cy="11" r="3.5" fill="#3fb950" />
      <text x="22" y="15" class="badge-text">UC IRVINE · SYSTEMS &amp; AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" class="main-title">arnav</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="94" class="subtitle">
      Exploring systems thinking, computational neuroscience, and synthetic intelligence.
    </text>

    <!-- Right Side Telemetry / Metrics -->
    <g transform="translate(560, 20)">
      <text x="250" y="15" text-anchor="end" class="meta-tag">PARADIGM // CLOSED-LOOP DYNAMICS</text>
      <text x="250" y="36" text-anchor="end" class="meta-tag" fill="#8b949e">SUBSTRATE // LIVING BRAIN &amp; SILICON</text>
      <text x="250" y="57" text-anchor="end" class="meta-tag" fill="#58a6ff">STATUS // ACTIVE RESEARCH &amp; BUILDS</text>
    </g>
  </g>
</svg>
