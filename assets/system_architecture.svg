<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="400">
  <defs>
    <style>
      @keyframes forwardPulse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -80; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .bg-panel { fill: #07090e; stroke: #1a202c; stroke-width: 1; rx: 8; }
      .grid-accent { stroke: #131722; stroke-width: 0.75; stroke-dasharray: 2, 8; }
      
      /* Base wire channels */
      .bus-wire { stroke: #181f2a; stroke-width: 2; fill: none; }
      
      /* Active animated signals - all decreasing stroke-dashoffset moves forward */
      .signal-sensory {
        stroke: url(#goldStream);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 10, 30;
        animation: forwardPulse 2.8s linear infinite;
      }
      .signal-efference {
        stroke: url(#purpleStream);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 8, 24;
        animation: forwardPulse 2.4s linear infinite;
      }
      .signal-motor {
        stroke: url(#cyanStream);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 10, 30;
        animation: forwardPulse 3.2s linear infinite;
      }
      .signal-internal {
        stroke: url(#greenStream);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 8, 20;
        animation: forwardPulse 2s linear infinite;
      }

      /* Node boxes */
      .node-card { fill: #0d1117; stroke: #232936; stroke-width: 1.2; rx: 5; }
      .node-card-highlight { fill: #0f141d; stroke: #313b4d; stroke-width: 1.4; rx: 5; }
      
      /* Typography */
      .node-id { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 9px; fill: #6e7681; letter-spacing: 0.1em; font-weight: 600; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 11.5px; font-weight: 700; fill: #f0efea; letter-spacing: 0.04em; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 10px; fill: #8b949e; }
      .node-tag { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.06em; font-weight: 600; }

      .system-header { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 10px; fill: #8b949e; letter-spacing: 0.12em; }
      .system-footer { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 9px; fill: #6e7681; letter-spacing: 0.08em; }
    </style>

    <!-- Marker Arrowheads -->
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff" />
    </marker>

    <!-- Gradients for Streams -->
    <linearGradient id="goldStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f2cc60" stop-opacity="1" />
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyanStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="greenStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="1" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#d2a8ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Panel Background -->
  <rect x="0.5" y="0.5" width="939" height="399" class="bg-panel" />

  <!-- Subtle Blueprint Guides -->
  <line x1="30" y1="45" x2="910" y2="45" class="grid-accent" />
  <line x1="30" y1="355" x2="910" y2="355" class="grid-accent" />
  <line x1="310" y1="20" x2="310" y2="380" class="grid-accent" />
  <line x1="630" y1="20" x2="630" y2="380" class="grid-accent" />

  <!-- Header Telemetry -->
  <text x="35" y="32" class="system-header">
    <tspan fill="#d29922">●</tspan> ARCHITECTURE // CLOSED-LOOP CYBERNETIC COGNITIVE MATRIX
  </text>
  <text x="905" y="32" class="system-header" text-anchor="end" fill="#6e7681">
    PREDICTIVE CODING · REAL-TIME ADAPTATION · ACTIVE INFERENCE
  </text>

  <!-- ======================== BUS WIRES & ANIMATED PATHS ======================== -->
  
  <!-- PATH 1: Physical Reality -> Sensory Receptors (Downwards) -->
  <!-- Start at bottom of Node 1 (150, 145), end at top of Node 2 (150, 185) -->
  <path d="M 150 145 L 150 180" class="bus-wire" />
  <path d="M 150 145 L 150 180" class="signal-sensory" marker-end="url(#arrowGold)" />

  <!-- PATH 2: Sensory Receptors -> Predictive Comparator (Curves right & up) -->
  <!-- Start at right of Node 2 (260, 225), curve up to left of Node 3 (360, 105) -->
  <path d="M 260 225 L 300 225 Q 310 225 310 215 L 310 115 Q 310 105 320 105 L 354 105" class="bus-wire" />
  <path d="M 260 225 L 300 225 Q 310 225 310 215 L 310 115 Q 310 105 320 105 L 354 105" class="signal-sensory" marker-end="url(#arrowGold)" />

  <!-- PATH 3: Predictive Comparator -> World Model (Downwards error residual) -->
  <!-- Start at bottom of Node 3 (470, 140), end at top of Node 4 (470, 175) -->
  <path d="M 470 140 L 470 172" class="bus-wire" />
  <path d="M 470 140 L 470 172" class="signal-internal" marker-end="url(#arrowGreen)" />

  <!-- PATH 4: World Model -> Synaptic Plasticity (Downwards parameter update) -->
  <!-- Start at bottom of Node 4 (470, 260), end at top of Node 5 (470, 292) -->
  <path d="M 470 260 L 470 288" class="bus-wire" />
  <path d="M 470 260 L 470 288" class="signal-internal" marker-end="url(#arrowGreen)" />

  <!-- PATH 5: World Model -> Policy Selection (Curves right & up) -->
  <!-- Start at right of Node 4 (580, 215), curve up to left of Node 6 (680, 105) -->
  <path d="M 580 215 L 620 215 Q 630 215 630 205 L 630 115 Q 630 105 640 105 L 674 105" class="bus-wire" />
  <path d="M 580 215 L 620 215 Q 630 215 630 205 L 630 115 Q 630 105 640 105 L 674 105" class="signal-motor" marker-end="url(#arrowCyan)" />

  <!-- PATH 6: Policy Selection -> Motor Actuation (Downwards command) -->
  <!-- Start at bottom of Node 6 (790, 145), end at top of Node 7 (790, 185) -->
  <path d="M 790 145 L 790 180" class="bus-wire" />
  <path d="M 790 145 L 790 180" class="signal-motor" marker-end="url(#arrowCyan)" />

  <!-- PATH 7: EFFERENCE COPY (Motor Actuation -> World Model, Straight Left!) -->
  <!-- Start at left of Node 7 (680, 225), go straight left to right of Node 4 (580, 225) -->
  <path d="M 680 225 L 586 225" class="bus-wire" />
  <path d="M 680 225 L 586 225" class="signal-efference" marker-end="url(#arrowPurple)" />

  <!-- PATH 8: MOTOR WORK INTERVENTION -> PHYSICAL REALITY (Bottom Return Loop!) -->
  <!-- Start at bottom of Node 7 (790, 265), go down to 335, left to 150, up to Node 1 (150, 145) -->
  <path d="M 790 265 L 790 325 Q 790 335 780 335 L 160 335 Q 150 335 150 325 L 150 151" class="bus-wire" />
  <path d="M 790 265 L 790 325 Q 790 335 780 335 L 160 335 Q 150 335 150 325 L 150 151" class="signal-motor" marker-end="url(#arrowCyan)" />

  <!-- ======================== NODES (CARDS) ======================== -->

  <!-- NODE 1: Physical Reality -->
  <g transform="translate(40, 65)">
    <rect width="220" height="80" class="node-card" />
    <circle cx="16" cy="18" r="3" fill="#8b949e" />
    <text x="26" y="21" class="node-id">01 // ENVIRONMENT</text>
    <text x="16" y="42" class="node-title">Physical Reality</text>
    <text x="16" y="58" class="node-desc">Continuous physics &amp; noise</text>
    <text x="16" y="71" class="node-tag" fill="#8b949e">DISSIPATIVE SUBSTRATE</text>
  </g>

  <!-- NODE 2: Sensory Receptors -->
  <g transform="translate(40, 185)">
    <rect width="220" height="80" class="node-card-highlight" />
    <line x1="0" y1="0" x2="220" y2="0" stroke="#d29922" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3" fill="#d29922" />
    <text x="26" y="21" class="node-id" fill="#d29922">02 // TRANSDUCTION</text>
    <text x="16" y="42" class="node-title">Sensory Ingestion</text>
    <text x="16" y="58" class="node-desc">Continuous signals &amp; spikes</text>
    <text x="16" y="71" class="node-tag" fill="#d29922">AFFERENT STREAM</text>
  </g>

  <!-- NODE 3: Predictive Comparator -->
  <g transform="translate(360, 65)">
    <rect width="220" height="75" class="node-card" />
    <circle cx="16" cy="18" r="3" fill="#3fb950" />
    <text x="26" y="21" class="node-id" fill="#3fb950">03 // COMPARATOR</text>
    <text x="16" y="40" class="node-title">Prediction Error</text>
    <text x="16" y="55" class="node-desc">Residual: ε = Sensation - Ŝ</text>
    <text x="16" y="67" class="node-tag" fill="#3fb950">SURPRISE MINIMIZATION</text>
  </g>

  <!-- NODE 4: Generative World Model -->
  <g transform="translate(360, 175)">
    <rect width="220" height="85" class="node-card-highlight" />
    <line x1="0" y1="0" x2="220" y2="0" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3" fill="#58a6ff" />
    <text x="26" y="21" class="node-id" fill="#58a6ff">04 // LATENT CORE</text>
    <text x="16" y="42" class="node-title">Generative World Model</text>
    <text x="16" y="58" class="node-desc">Attractor dynamics &amp; beliefs</text>
    <text x="16" y="74" class="node-tag" fill="#58a6ff">STATE SPACE ESTIMATION</text>
  </g>

  <!-- NODE 5: Synaptic Plasticity -->
  <g transform="translate(360, 290)">
    <rect width="220" height="55" class="node-card" />
    <circle cx="16" cy="16" r="3" fill="#3fb950" />
    <text x="26" y="19" class="node-id" fill="#3fb950">05 // PLASTICITY</text>
    <text x="16" y="36" class="node-title" style="font-size: 11px;">Continuous Adaptation</text>
    <text x="16" y="48" class="node-desc" style="font-size: 9.5px;">Online parameter reorganization</text>
  </g>

  <!-- NODE 6: Policy Selection -->
  <g transform="translate(680, 65)">
    <rect width="220" height="80" class="node-card" />
    <circle cx="16" cy="18" r="3" fill="#58a6ff" />
    <text x="26" y="21" class="node-id" fill="#58a6ff">06 // POLICY</text>
    <text x="16" y="42" class="node-title">Action Planning</text>
    <text x="16" y="58" class="node-desc">Goal-directed motor selection</text>
    <text x="16" y="71" class="node-tag" fill="#58a6ff">ACTIVE INFERENCE</text>
  </g>

  <!-- NODE 7: Motor Actuation -->
  <g transform="translate(680, 185)">
    <rect width="220" height="80" class="node-card-highlight" />
    <line x1="0" y1="0" x2="220" y2="0" stroke="#3fb950" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3" fill="#3fb950" />
    <text x="26" y="21" class="node-id" fill="#3fb950">07 // EFFERENT</text>
    <text x="16" y="42" class="node-title">Motor Actuation</text>
    <text x="16" y="58" class="node-desc">Kinetic work &amp; intervention</text>
    <text x="16" y="71" class="node-tag" fill="#3fb950">CLOSED-LOOP CONTROL</text>
  </g>

  <!-- Footer Annotations -->
  <text x="35" y="375" class="system-footer">
    FLOW // [1] SENSORY INGESTION → [2] ERROR COMPUTATION → [3] STATE ESTIMATION → [4] ACTION SELECTION → [5] WORK
  </text>
  <text x="905" y="375" class="system-footer" text-anchor="end" fill="#bc8cff">
    ● PURPLE BUS: INTERNAL EFFERENCE COPY (ANTICIPATORY PREDICTION)
  </text>
</svg>